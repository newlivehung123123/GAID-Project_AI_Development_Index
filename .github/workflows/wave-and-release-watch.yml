# Weekly flag-and-wait watcher: checks Dataverse for a new GAID wave and the
# model catalogues for new frontier releases. It only OPENS AN ISSUE — no
# download, no eval, no spend ever happens automatically.
name: wave-and-release-watch

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check Dataverse for a new wave
        id: wave
        run: |
          out=$(python -m gaid_pipeline check)
          echo "$out"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if echo "$out" | grep -q "New wave available  : YES"; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check model catalogues for new frontier releases
        id: releases
        run: |
          set +e
          out=$(python -m gaid_pipeline watch)
          code=$?
          set -e
          echo "$out"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi

      - name: Open notification issue
        if: steps.wave.outputs.new == 'true' || steps.releases.outputs.new == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const wave = `${{ steps.wave.outputs.new || 'false' }}` === 'true';
            const rel  = `${{ steps.releases.outputs.new || 'false' }}` === 'true';
            const title = wave && rel ? 'New GAID wave AND new frontier release(s)'
                        : wave ? 'New GAID wave available on Dataverse'
                        : 'New frontier model release(s) detected';
            const body = [
              wave ? '## Dataverse\n```\n${{ steps.wave.outputs.summary }}\n```' : '',
              rel  ? '## Release watch\n```\n${{ steps.releases.outputs.summary }}\n```' : '',
              '---',
              'Policy: **flag-and-wait**. Nothing has been downloaded or evaluated.',
              'To act: run `sync → harmonise → screen → indices → queries` locally,',
              'then launch `run-eval`/`run-panel` yourself (or via the eval-run',
              'workflow dispatch) with an explicit budget.',
            ].filter(Boolean).join('\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['watcher'],
            });
