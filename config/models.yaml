# Model registry: the eval panel + release-watch configuration.
#
# Two triggers feed one eval engine:
#   1. Data trigger  — new GAID wave on Dataverse -> re-evaluate every `active`
#      panel model (delta evaluation: only new/changed observations + a fixed
#      drift-control subsample).
#   2. Model trigger — release watcher spots a new frontier model matching the
#      watch criteria -> it is added here as `candidate` and a notification is
#      opened. Nothing runs until Jason flips it to `active` and launches the
#      run himself (cost control; runs are always human-launched).
#
# training_cutoff.status is `documented` or `estimated`; temporal analyses
# automatically run a sensitivity excluding estimated-cutoff models
# (IEEE reviewer 1, weakness 4).

panel:
  # --- open-weight core (reproducible; runs on free tiers) ---
  - id: llama-4-maverick
    endpoint: meta-llama/llama-4-maverick        # OpenRouter id
    # :free variant retired from the OpenRouter catalogue (checked 2026-07-07)
    developer: Meta AI
    developer_origin: US
    weights: open
    training_cutoff: { date: "2024-08", status: documented, source: "Meta model card" }
    status: active
  - id: mistral-large-3
    endpoint: mistralai/mistral-large-2512       # Mistral Large 3 (versioned slug; old alias retired)
    developer: Mistral AI
    developer_origin: EU
    weights: open
    training_cutoff: { date: "2025-late", status: estimated, source: "NVIDIA model card" }
    status: active
  - id: qwen3-235b-a22b
    endpoint: qwen/qwen3-235b-a22b
    # w1_v2 round evaluated in provider-DEFAULT thinking mode (usable output,
    # ~1k billed reasoning tokens/query). Do not change mid-wave.
    developer: Alibaba Cloud
    developer_origin: CN
    weights: open
    training_cutoff: { date: "2025-mid", status: estimated, source: "Qwen blog" }
    status: active
  - id: deepseek-v3-0324
    endpoint: deepseek/deepseek-chat-v3-0324
    developer: DeepSeek
    developer_origin: CN
    weights: open
    training_cutoff: { date: "2024-07", status: estimated, source: "Knostic system-prompt extraction" }
    status: active
  - id: glm-5-2
    endpoint: z-ai/glm-5.2                       # weights: huggingface.co/zai-org/GLM-5.2
    developer: Zhipu AI (Z.ai)
    developer_origin: CN
    weights: open
    training_cutoff: { date: "TBC", status: estimated, source: "verify Z.ai model card" }
    generation_overrides: { reasoning: "off" }     # thinking on by default; provider
                                                 # truncates content at max_tokens
    status: active

  # --- proprietary annex (optional; clearly separated in analysis; goes
  #     through provider batch endpoints at 50% off when run) ---
  - id: claude-opus-4-6
    endpoint: anthropic/claude-opus-4.6
    developer: Anthropic
    developer_origin: US
    weights: proprietary
    training_cutoff: { date: "2025", status: documented, source: "Anthropic model card" }
    status: inactive   # pilot already run in Apart study; activate for annex rounds
  # further annex candidates (live OpenRouter slugs verified 2026-07-08).
  # NOTE: gpt-5.6 / grok-4.4 / grok-4.5 do NOT exist on OpenRouter; the two
  # most current per lab are registered instead. Flip status to `active` and
  # fill a documented cutoff before running.
  - id: gpt-5-5
    generation_overrides: { reasoning: minimal, max_tokens: 400 }
    endpoint: openai/gpt-5.5                     # ~$17.5/run (2026-04-24)
    developer: OpenAI
    developer_origin: US
    weights: proprietary
    training_cutoff: { date: "TBC", status: estimated, source: "verify OpenAI model card" }
    status: inactive
  - id: gpt-5-4
    generation_overrides: { reasoning: minimal, max_tokens: 400 }
    endpoint: openai/gpt-5.4                     # ~$8.8/run (2026-03-05)
    developer: OpenAI
    developer_origin: US
    weights: proprietary
    training_cutoff: { date: "TBC", status: estimated, source: "verify OpenAI model card" }
    status: inactive
  - id: grok-4-3
    generation_overrides: { max_tokens: 1500 }  # reasoning not disableable
    endpoint: x-ai/grok-4.3                      # ~$1.7/run (2026-04-30, newest Grok)
    developer: xAI
    developer_origin: US
    weights: proprietary
    training_cutoff: { date: "TBC", status: estimated, source: "verify xAI model card" }
    status: inactive
  - id: grok-4-20
    generation_overrides: { max_tokens: 1500 }  # reasoning not disableable
    endpoint: x-ai/grok-4.20                     # ~$1.7/run (2026-03-31)
    developer: xAI
    developer_origin: US
    weights: proprietary
    training_cutoff: { date: "TBC", status: estimated, source: "verify xAI model card" }
    status: inactive
  - id: claude-opus-4-8
    endpoint: anthropic/claude-opus-4.8          # ~$14.9/run (2026-05-27)
    developer: Anthropic
    developer_origin: US
    weights: proprietary
    training_cutoff: { date: "TBC", status: estimated, source: "verify Anthropic model card" }
    status: inactive
  - id: gemini-3-1-pro
    generation_overrides: { reasoning: minimal, max_tokens: 800 }
    endpoint: google/gemini-3.1-pro-preview      # ~$7/run; preview endpoint
    developer: Google DeepMind
    developer_origin: US
    weights: proprietary
    training_cutoff: { date: "TBC", status: estimated, source: "verify Google model card" }
    status: inactive

watch:
  # Weekly GitHub Actions job diffs OpenRouter's /api/v1/models list and the
  # Hugging Face orgs below against this registry. Matches become `candidate`
  # entries in a notification issue with an estimated eval cost. flag-and-wait:
  # nothing is ever evaluated automatically.
  policy: flag-and-wait
  huggingface_orgs: [meta-llama, deepseek-ai, Qwen, mistralai, moonshotai, zai-org]
  criteria:
    frontier_only: true          # flagship-tier releases, not mini/nano/distill variants
    exclude_patterns: ["*-mini*", "*-nano*", "*distill*", "*guard*", "*-vl*"]
    min_weeks_public: 4          # let a release accumulate independent benchmarks first
                                 # (same rationale the IEEE paper used to defer Qwen3.5)
